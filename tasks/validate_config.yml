---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "tsdproxy_tailscale_authkey", "new": "tsdproxy_config_tailscale_providers_default_authkey" }
    - { "old": "tsdproxy_config_tailscale_providers_default_authkeyfile", "new": "tsdproxy_config_tailscale_providers_default_authkeyfile" }
    - { "old": "tsdproxy_controlurl", "new": "tsdproxy_config_tailscale_providers_default_controlurl" }
    - { "old": "tsdproxy_additional_providers", "new": "tsdproxy_config_tailscale_providers_additional_providers" }
    - { "old": "tsdproxy_loglevel", "new": "tsdproxy_config_log_level" }
    - { "old": "tsdproxy_proxyaccesslog", "new": "tsdproxy_config_proxyaccesslog" }
    - { "old": "tsdproxy_extra_config", "new": "tsdproxy_configuration_extension_yaml" }
    - { "old": "tsdproxy_environment_variables_extension", "new": "tsdproxy_environment_variables_additional_variables" }
    - { "old": "tsdproxy_container_additional_mounts", "new": "tsdproxy_container_additional_volumes" }
    - { "old": "tsdproxy_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required TSDProxy settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - tsdproxy_uid
    - tsdproxy_gid
    - tsdproxy_docker_endpoint
    - tsdproxy_config_tailscale_providers_default_controlurl
